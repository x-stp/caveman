name: pin-check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sha-pinning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify every action `uses:` is pinned to a 40-char SHA
        run: |
          set -euo pipefail
          # Match `uses: <ref>` lines whose ref is not exactly @<40-hex-sha>.
          # Allow comments after the SHA for human-readable version annotation.
          bad=$(grep -rHnE '^\s*-?\s*uses:\s+[^@[:space:]]+@[^[:space:]#]+' .github/workflows/ \
                | grep -vE '@[a-f0-9]{40}([[:space:]]|#|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unpinned action references found. Pin every action to a 40-char commit SHA."
            echo "$bad"
            exit 1
          fi
          echo "All action uses are SHA-pinned."
