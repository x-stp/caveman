name: upstream-diff

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/JuliusBrussee/caveman.git || true
          git fetch --no-tags upstream main

      - name: Diff install-path against last-audited SHA
        id: diff
        run: |
          set -euo pipefail
          if [ ! -f .audited/manifest.json ]; then
            echo "No .audited/manifest.json — first run, nothing to compare against."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(jq -r '.upstream_sha' .audited/manifest.json)
          CURRENT=$(git rev-parse upstream/main)
          echo "last=$LAST current=$CURRENT"
          if [ "$LAST" = "$CURRENT" ]; then
            echo "No upstream movement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$LAST" "$CURRENT" -- \
              install.sh install.ps1 bin/ src/hooks/ src/tools/caveman-init.js .github/workflows/; then
            echo "Upstream moved but install path unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Install path changed."
            {
              echo "changed=true"
              echo "last=$LAST"
              echo "current=$CURRENT"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open re-audit-needed issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST: ${{ steps.diff.outputs.last }}
          CURRENT: ${{ steps.diff.outputs.current }}
        run: |
          # shellcheck disable=SC2016  # printf format string is intentionally single-quoted
          body=$(printf 'Upstream `JuliusBrussee/caveman@main` advanced from `%s` to `%s` with changes touching install path files. Re-run Phase B rubric before bumping `.audited/manifest.json`.\n\nCompare: https://github.com/JuliusBrussee/caveman/compare/%s...%s' \
            "$LAST" "$CURRENT" "$LAST" "$CURRENT")
          gh issue create \
            --title "re-audit-needed: upstream install path moved ${LAST:0:7} -> ${CURRENT:0:7}" \
            --label "re-audit-needed" \
            --label "security" \
            --body "$body"
