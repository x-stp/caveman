# Local pre-commit chain. Mirrors the CI scanners so issues surface before push.
#
# Install:
#   brew install pre-commit       # or: pipx install pre-commit
#   pre-commit install            # wires the .git/hooks/pre-commit
#
# Run manually:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # zizmor runs from a local install (brew install zizmor / pipx install zizmor).
  # Keeping it local-language avoids a second toolchain bootstrap and matches
  # the CI version surface.
  - repo: local
    hooks:
      - id: zizmor
        name: zizmor (workflow audit)
        language: system
        entry: zizmor
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
        args: ['--quiet', '.github/workflows/']
